<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05090e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Punch Logic" />
    <title>Punch Logic Admin</title>
    <link rel="icon" href="punch-logic-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="tokens.css?v=1" />
    <link rel="stylesheet" href="admin.css?v=58" />
    <link rel="stylesheet" href="admin-modern.css?v=20" />
  </head>
  <body>
    <div class="admin-auth-screen" id="adminAuthScreen">
      <section class="admin-auth-panel">
        <p class="eyebrow">Punch Logic Admin</p>
        <h1>Sign in</h1>
        <p>Use your email and password.</p>
        <input id="adminEmailInput" type="email" autocomplete="username" placeholder="Email" />
        <input id="adminPasswordInput" type="password" autocomplete="current-password" placeholder="Password" />
        <button class="primary-button" id="adminLoginButton" type="button">Sign in</button>
        <button class="auth-link-button" id="adminForgotPasswordButton" type="button">Forgot password?</button>
        <small id="adminAuthError"></small>
      </section>
    </div>

    <div class="admin-auth-screen" id="adminPasswordResetScreen">
      <section class="admin-auth-panel">
        <p class="eyebrow">Account Recovery</p>
        <h1>New password</h1>
        <p>Enter a new password for your Punch Logic account.</p>
        <input id="adminNewPasswordInput" type="password" autocomplete="new-password" minlength="8" placeholder="New password" />
        <input id="adminConfirmPasswordInput" type="password" autocomplete="new-password" minlength="8" placeholder="Confirm password" />
        <button class="primary-button" id="adminSaveNewPasswordButton" type="button">Save password</button>
        <small id="adminPasswordResetError"></small>
      </section>
    </div>

    <main class="admin-shell">
      <aside class="admin-sidebar">
        <div class="brand-block">
          <a class="brand-home-link" href="http://punchlogic.app" target="_blank" rel="noopener noreferrer" aria-label="Open Punch Logic website">
            <img class="brand-mark" src="punch-logic-combined-logo.svg" alt="Punch Logic" />
          </a>
        </div>

        <nav class="admin-nav" aria-label="Admin sections">
          <button class="active" data-admin-section="items" type="button"><i data-lucide="clipboard-list"></i><span>Open Items</span><b>All active work</b></button>
          <button data-admin-section="completedItems" type="button"><i data-lucide="square-check-big"></i><span>Completed Items</span><b>7 business days</b></button>
          <button data-admin-section="reports" type="button"><i data-lucide="file-chart-column"></i><span>Reports</span><b>Generate reports</b></button>
          <button data-admin-section="users" type="button"><i data-lucide="users"></i><span>Users</span><b>Manage access</b></button>
          <button data-admin-section="projects" type="button"><i data-lucide="folder-kanban"></i><span>Projects</span><b>Groups</b></button>
          <button data-admin-section="sites" type="button"><i data-lucide="building-2"></i><span>Sites</span><b>Assignments</b></button>
          <button data-admin-section="documents" type="button">
            <svg class="doc-paper-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path class="doc-paper-sheet" d="M6 2.5h8l4 4v15H6z"></path>
              <path class="doc-paper-fold" d="M14 2.5v4h4"></path>
              <text class="doc-paper-label" x="12" y="16.3" text-anchor="middle">DOC</text>
            </svg>
            <span>Documents</span><b>Site files</b>
          </button>
          <button data-admin-section="contacts" type="button"><i data-lucide="contact-round"></i><span>Contacts</span><b>Directory</b></button>
          <button data-admin-section="archive" type="button"><i data-lucide="archive"></i><span>Archive</span><b>Projects and sites</b></button>
          <button data-admin-section="settings" type="button"><i data-lucide="sliders-horizontal"></i><span>Settings</span><b>Dropdowns</b></button>
        </nav>

        <button class="sidebar-signout" id="adminSignOutButton" type="button"><i data-lucide="log-out"></i><span>Sign out</span></button>
      </aside>

      <section class="admin-content">
        <header class="admin-header">
          <div>
            <a class="brand-home-link" href="http://punchlogic.app" target="_blank" rel="noopener noreferrer" aria-label="Open Punch Logic website">
              <img class="admin-header-logo" src="punch-logic-logo.svg" alt="Punch Logic" />
            </a>
            <h2 id="adminTitle">Users</h2>
            <p id="adminSubtitle">Create users and decide which sites each person can access.</p>
          </div>
          <div class="admin-top-actions">
            <button class="notification-button" id="notificationButton" type="button" aria-label="Recent changes">
              <i data-lucide="bell"></i>
              <span id="notificationCount">0</span>
            </button>
            <button class="theme-button" id="adminThemeButton" type="button" aria-label="Switch to light mode"><i data-lucide="sun"></i></button>
            <section class="metric-grid" aria-label="Admin summary">
              <article>
                <i data-lucide="clipboard-list"></i>
                <span>Open Items</span>
                <strong id="metricItems">0</strong>
              </article>
            </section>
            <button class="primary-button" id="adminActionButton" type="button">Add User</button>
          </div>
        </header>

        <section class="notification-panel hidden" id="notificationPanel" aria-label="Recent changes"></section>

        <section class="admin-panel" id="adminPanel"></section>
      </section>
    </main>

    <script src="supabase-config.js?v=3"></script>
    <script src="client-branding.js?v=1"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8" integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/lucide@1.25.0/dist/umd/lucide.min.js" integrity="sha384-UoXAhqcCCjwD94x4CCSExEHvtO49AfNiY7g/IxDgrPtx4U6o6tvy1cScx9v/RrS9" crossorigin="anonymous"></script>
    <script src="upload-security.js?v=1"></script>
    <script src="password-visibility.js?v=1"></script>
    <script src="admin.js?v=75"></script>
  </body>
</html>
